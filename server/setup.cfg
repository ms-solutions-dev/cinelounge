# ---------------------------------------------------------------
# Der Schichtvertrag.
#
# In Swift erzwingt ihn SwiftPM: Ein Paket kann nur benutzen, was es
# als Abhaengigkeit deklariert, und falsche Abkuerzungen fallen beim
# Uebersetzen auf. Python hat das nicht — deshalb steht die Regel hier
# und `lint-imports` bricht `pruefen.sh` ab, wenn sie gebrochen wird.
#
# Ohne dieses Stueck ist der Grundriss in ARCHITEKTUR.md eine
# Absichtserklaerung.
#
# Nur ASCII in dieser Datei: import-linter liest sie mit der
# Plattform-Zeichensatz, und unter Windows ist das cp1252. Ein Rahmen aus
# Doppelstrichen hat den Lauf mit „charmap codec can't decode byte 0x90"
# abgebrochen, bevor der erste Vertrag geprueft war.
# ---------------------------------------------------------------
[importlinter]
root_package = cinelounge

[importlinter:contract:layers]
name = Bottom to top, never back
type = layers
layers =
    cinelounge.web
    cinelounge.market | cinelounge.household
    cinelounge.portalworks
    cinelounge.stream | cinelounge.language
    cinelounge.core

[importlinter:contract:core-depends-on-nothing]
name = The core knows no other package
type = forbidden
source_modules = cinelounge.core
forbidden_modules =
    cinelounge.web
    cinelounge.portalworks
    cinelounge.market
    cinelounge.household
    cinelounge.stream
